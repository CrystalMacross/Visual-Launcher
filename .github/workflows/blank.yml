name: Build Visual Launcher

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npm run dist -- --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: visual-launcher-windows
          path: launcher/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: visual-launcher-windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Visual Launcher ${{ github.ref_name }}
          files: artifacts/*.exe
          body: |
            **Visual Launcher**

            Windows installer for the Visual Launcher.
